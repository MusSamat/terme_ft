name: web-ci

on:
  push:
    branches: [main, master]
    paths: [ "../../src/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: [ "../../src/**", ".github/workflows/web-ci.yml"]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.terme.kg/v1
          NEXT_PUBLIC_WS_URL: wss://api.terme.kg
          NEXT_PUBLIC_SITE_URL: https://terme.kg
